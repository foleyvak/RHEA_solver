[project]
name = "rhea_solver"
version = "0.1.0"
description = "RHEA Flow Solver Environment"
authors = ["Your Name <your.email@example.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tasks]
# This creates a shortcut command to run your script
start = "python rhea_flow_solver.py"

[dependencies]
python = ">=3.14.4,<3.15"
numpy = ">=2.4.3,<3"
numba = ">=0.65.0,<0.66"
sympy = ">=1.14.0,<2"
matplotlib = ">=3.10.8,<4"
scipy = ">=1.17.1,<2"
coolprop = ">=7.1.0,<8"
pandas = ">=3.0.2,<4"
